<p>类型：部分、完整或持续动作（因武器而异）子类型：杂项</p>

<p class="prose">活跃角色可以重新装填远程武器。 重新装填动作所需的时间取决于武器。 详见第五章：军械库。 请注意，任何需要一轮以上的装填动作都是持续动作。</p>
