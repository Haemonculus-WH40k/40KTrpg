<p>"我们曾经是神。"</p>

<p>——被禁止的科技异端文本《为未来辩护；逻辑论述》M.38的开头语。</p>

<p class="prose">Servitors是自动机或机器人，其基本控制组件通常是有机的，大多源自人类。创建Servitor的过程会清除主体的高级脑功能和精神模式，从而销毁其个性和意志，将其转变为可被编程的空白画板。Servitors在形状和功能上可以变化很大，从粗糙但强大的工业模型，到无脸的基本劳动无人机，到为富裕和强大的人服务的镀金和独特的创作。</p>
