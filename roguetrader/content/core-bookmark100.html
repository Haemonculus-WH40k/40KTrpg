<p>类型：完整动作 子类型：专注、移动</p>

<p class="prose">活跃角色从一个掩体位置移动到另一个掩体位置。在这样做的情况下，他以移动至多他移动力的距离。 在移动期间，他被认为受益于他之前离开的掩护，即使他实际上在空旷的地方移动了一小段时间。</p>
