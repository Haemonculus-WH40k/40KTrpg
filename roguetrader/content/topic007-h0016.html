<p>前置：黑暗灵族，死眼射击，感知 45，痛苦即力量（痛苦即力量）</p>

<p class="prose">远距离击杀敌人的困惑、被弹雨笼罩的猎物的恐慌——这些景象令人愉悦。当一次以该角色为中心、半径等于其感知加值米数范围内的远程攻击对活物造成致命伤、眩晕或击杀，或致使其恐惧或压制检定失败时，该角色获得一个痛苦点。若角色同时有资格通过邪恶快感中的残酷终结获得痛苦点，则此效果与之累积。</p>
