<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=9"><title>打倒（X）（Felling (X)）</title><link rel="stylesheet" href="style.css"></head><body class="semantic-topic"><h1>打倒（X）（Felling (X)）</h1><div class="source-note">来源：RT灵魂掠夺者.docx</div><div class="semantic-path"><a href="topic007.html">RT灵魂掠夺者（黑暗灵族扩）</a></div><nav class="semantic-nav"><a class="prev" href="topic007-h0034.html#topic007-h0034">← 致残（X）（Crippling (X)）</a><a class="up" href="topic007-h0033.html#topic007-h0033">↑ 新武器品质</a><a class="next" href="topic007-h0036.html#topic007-h0036">确凿（X）（Proven (X)） →</a></nav><span id="topic007-h0035" class="anchor"></span>
<p class="prose">打倒武器专为穿刺与撕裂而设计，能够击倒最强大的敌人。若武器命中，它忽略目标拥有的等于括号中数值的超自然坚韧等级数。例如，打倒（1）武器忽略超自然坚韧（x2）的增益，并将超自然坚韧（x3）的增益降低一个倍数。</p>
