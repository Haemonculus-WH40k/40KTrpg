<p>第 41 个千年的银河系是一个奇怪的 、无边无际的地方 ，同时充满了恐怖和奇迹 。其中的个体 、生物和外星种族也是如此 。探索者们在科罗诺斯扩张区和其他地方可以遇到许多这样的人 ，从肉体凡胎的敌人、强大的盟友和人类的对手到来自其他世界的野兽乃至可以想象的最可怕的恐怖之物。当然 ， 其中关键是要知道哪一个是哪一个</p>
