<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=9"><title>致残（X）（Crippling (X)）</title><link rel="stylesheet" href="style.css"></head><body class="semantic-topic"><h1>致残（X）（Crippling (X)）</h1><div class="source-note">来源：RT灵魂掠夺者.docx</div><div class="semantic-path"><a href="topic007.html">RT灵魂掠夺者（黑暗灵族扩）</a></div><nav class="semantic-nav"><a class="prev" href="topic007-h0033.html#topic007-h0033">← 新武器品质</a><a class="up" href="topic007-h0033.html#topic007-h0033">↑ 新武器品质</a><a class="next" href="topic007-h0035.html#topic007-h0035">打倒（X）（Felling (X)） →</a></nav><span id="topic007-h0034" class="anchor"></span>
<p class="prose">某些尤为残忍或致命的武器会在受害者伤口中留下活体倒刺或碎片，造成剧烈疼痛甚至缓慢致死。当目标受到具有致残品质的武器造成的至少1点伤害（在扣除护甲与坚韧加值之后）时，其在剩余的战斗遭遇中或直到所有伤害被治愈前，视为处于“残疾”状态。若致残角色在单个回合内执行超过一个半动作，则该角色承受等于括号中数值（X）的撕裂伤。此伤害不受护甲或坚韧加值减免。</p>
