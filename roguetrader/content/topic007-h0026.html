<p>前置：痛苦即力量，折磨者之活力</p>

<p class="prose">黑暗灵族在饱餐敌人的恐惧后，在战斗中势不可挡。在一次遭遇中获得至少四个痛苦标记后，此角色可消耗一个命运点，在遭遇剩余时间内获得噩梦物质特性。</p>
