<p><em>“与黑暗灵族打交道时，永远不要相信‘眼见为实’。唯一确凿的真相是，你看到的正是他们希望你看到的。”</em></p>

<p><em>——瑞哈达尔·安塔瑞尔，海盗</em></p>

<p class="prose">黑暗灵族迅捷、敏锐、残忍，且惯于暴力。他们每个人都是危机中的幸存者，在杀戮横行的残酷环境中度过早年，每个人都试图以暴力与诡计的结合来支配周围的人。本章包含关于创建黑暗灵族阴谋团武士探险者的信息，以及关于栖居于可怕的阴影枢纽中众多黑暗灵族NPC的信息。</p>
