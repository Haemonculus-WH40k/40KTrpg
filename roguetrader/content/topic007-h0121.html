<p class="prose">一群盗贼与匪徒伏击了探险者，意图轻松劫掠——但他们严重低估了目标。这是一群人数为探险者两倍（若探险者等级为4或以上，则为三倍）的渣滓，他们会选择有利位置埋伏，随后发起突袭。这些渣滓是懦夫，若死亡人数过半便会逃走。此类亡命之徒的数据参见《行商浪人》核心规则书第371页“人渣”。</p>
