<p>前置：痛苦即力量</p>

<p class="prose">黑暗灵族的身体能力因他人的痛苦而大幅增强。在一次遭遇中获得至少三个痛苦点后，此角色可消耗一个命运点，在遭遇剩余时间内获得超自然力量（x2）特性。</p>
