<p class="prose">此武器的剪切锋刃能滑穿最先进的护甲，如同滑穿粗劣的锡皮。使用此武器进行攻击检定时，若攻击掷骰获得两个或以上的成功度，则该次攻击的穿甲值翻倍。</p>
