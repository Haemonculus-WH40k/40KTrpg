<p>前置：痛苦即力量</p>

<p class="prose">黑暗灵族在痛苦之力的驱动下，思绪不受凡人生存之脆弱与恐惧的蒙蔽。在一次遭遇中获得至少两个痛苦点后，此角色可消耗一个命运点，在遭遇剩余时间内获得来自彼岸特性。</p>
