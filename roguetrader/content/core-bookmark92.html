<p>类型：反应 子类型：防御，近战</p>

<p class="prose">如果活跃角色正装备着一把能够招架的近战武器，他可以尝试通过进行一次挑战难度的 (+0)武器技能检定来挫败即将到来的近战攻击。 如果检定成功，则认为这次砍来的攻击未能命中。如果检定失败，攻击继续并正常投掷伤害。 招架不需要特殊的技能或天赋，但招架只能用于抵消近战攻击。</p>
