<p class="prose">在枢纽的部分区域，黑暗灵族会堆积家奴或是竞技场战死选手的残骸，留待日后处理。玩家角色将会发现这样一处场所——一个堆满尸体的坑洞。GM可以借这场遭遇引入NPC，比如掩埋在尸体堆中尚存一息的奴隶，也可以借此提供线索——某具尸体上的物品能帮助探险者在阴影枢纽中找到正确路径。此外，当探险者发现这片屠杀现场后，GM应当要求每位探险者进行一次恐惧检定（恐惧1）。</p>
