<p>智力，技能组：网道</p>

<p class="prose">禁忌学识技能代表通常被某个组织或社会所隐藏、遮蔽或禁止的知识。以下新增技能组已加入可用技能之列。本技能运作方式不变。</p>

<p><strong>-网道：</strong>关于灵族迷宫维度之秘密与隐匿本质的知识，通常仅由笑神的丑角及极少数博学的灵族所知。</p>
