<p>前置：黑暗灵族，痛苦即力量</p>

<p class="prose">黑暗灵族可将汲取的痛苦转化为战斗中更猛烈的凶残，在冲锋的动能中施以更恶毒的创伤。在一次遭遇中获得至少一个痛苦点后，此角色可消耗一个命运点，在遭遇剩余时间内获得狂暴冲锋天赋与兽性冲锋特性。</p>
