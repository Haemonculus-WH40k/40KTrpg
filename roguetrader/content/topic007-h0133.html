<p class="prose">天球中有许多区域对生命有毒，甚至进入本身便十分危险。当探险者到达此区域时，他们会意识到高强度的辐射（虚空服指示器或灵能探测器会发出警报）。穿越此类区域每小时需通过一次困难（–10）坚韧检定，以抵抗获得一级疲劳——这种疲劳只能通过医疗处理与仪式净化来消除。净化过程需要一次普通（+10）医疗检定，并在辐射区外至少停留一整天。因此类疲劳而陷入昏迷的角色将屈服于辐射并死亡。</p>
