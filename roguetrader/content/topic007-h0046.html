<p>“没有恶棍的故事不是好故事。我将为你呈现一个超越你想象、乃至超越你理解的反派——而你将在临死之际，以美妙的方式诅咒我的名字。”</p>

<p>——德雷卡鲁斯，缝合螺旋之主</p>

<p class="prose">本节包含冒险中出现的若干重要角色。有些是能协助探险者的伟大斗士，有些是必须铲除的邪恶敌人，而许多角色则视冒险的基调与探险者的行动而定，可能扮演任一角色。</p>
