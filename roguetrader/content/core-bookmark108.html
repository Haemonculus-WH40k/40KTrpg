<p class="prose">当一个角色不知道他即将被攻击时，他被认为是一个未察觉的目标。 通常，这发生在战斗开始，当一个或多个角色遇袭时（参见第 235 页）。 攻击未察觉目标的武器技能或弹道技能检定为容易（+30）难度。</p>
