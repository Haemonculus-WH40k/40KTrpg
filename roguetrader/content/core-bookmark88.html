<p>类型：部分动作 子类型：近战，移动</p>

<p class="prose">通过出色的步法和强大的侵略性，攻击者可以通过一次成功的武器技能对抗检定来迫使对手向任何方向移动一米。如果需要，攻击者也可以前进一米。不能在强迫对手移动时让其和另一个角色或其他障碍物（如墙）重合。</p>
