<p>类型：完整动作 子类型：攻击、近战或远程</p>

<p class="prose">这个动作允许活跃角色在他的回合中进行多次攻击，前提是他具有迅捷攻击或闪电快攻天赋，或者装备了一把副手武器。参见双持武器战斗，第 246 页。</p>
