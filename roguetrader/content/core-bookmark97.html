<p>类型：部分动作 子类型：攻击、近战或远程</p>

<p class="prose">主动角色通过武器检定技能来进行一次近战攻击，或通过检定弹道技能来进行一次远程攻击。如果攻击角色没有武器，他可以尝试擒抱对手而不是造成伤害。 参见第 246 页的擒抱。</p>
