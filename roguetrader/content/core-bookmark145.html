<p class="prose">帝国的生活方式至少和星球的数量一样多，而那些人口最多的世界中同样也有数量惊人的亚文化，从那些沉浸在贵族生活中的人，到那些处于极度贫困的人不一而足。在许多世界上，这两种文化相安无事，而在另一些世界上，社会上层对那些不受宠爱的人保持着故意的无视。每个世界都有自己的习俗、传统、血统和遗产。那些在星际间旅行的人必须习惯于人类那无限变化的多种表现形式。</p>
