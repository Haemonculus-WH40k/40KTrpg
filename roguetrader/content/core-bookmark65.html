<p>生命维持系统极其重要，因为它为舰船提供了洁净的空气与饮水。</p>

<h2><strong>马克</strong> <strong>1.r</strong> <strong>型生命维持系统</strong></h2>

<p class="prose">这种生命维持系统是为可靠性而设计的，对消除油的臭味和亚空间引擎的排放物没有什么作用。污浊空气:所有士气损失增加 1。</p>

<h2><strong>维塔型生命维持系统</strong></h2>

<p>这种基于 STC 的生命维持系统广泛地用于卡利西斯星区</p>
