<p>破坏者是黑暗灵族最具代表性的炮艇，乍看之下不过是一艘加强火力的掠袭者。两者之间的区别微妙却显著。破坏者在所有方面均与掠袭者相同，只有以下差异：</p>

<p>·装甲正面24，侧面21，后方15。</p>

<p>·乘员增加至1名驾驶员和3名炮手。每名炮手各操作一门黑暗光矛或分解炮。</p>

<p>·运载容量降至0，并移除危险搭载特殊规则。</p>
