<p class="prose">如果玩家想要做此处描述的动作所未涵盖的事情，应该由GM 判断某事可能需要多长时间以及它将是什么类型的动作。 一般来说，大多数动作都应该通过某种检定来解决：属性检定、技能检定或对抗性检定。 请记住，一轮只有几秒钟，这对于可以完成的任务来说是一段非常有限的时间。</p>
