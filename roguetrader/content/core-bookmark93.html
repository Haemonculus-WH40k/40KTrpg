<p>类型：部分动作 子类型：杂项</p>

<p class="prose">活跃角色拔出一把武器或取搜取放在小袋或口袋中的物体。 武器或物品也可以通过此动作正确收起（但请注意，简单地丢下物品被视为自由动作）。 这个动作也可以用来做一些事情，比如使用医疗贴片、注射兴奋剂或其他种类的药物、给刀片涂上毒药等等。 如果在两种不同的武器或物品上使用准备，则可以在同一回合中声明执行两次。</p>
