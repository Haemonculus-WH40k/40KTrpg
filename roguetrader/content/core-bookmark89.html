<p>类型：部分或完整动作 子类型：移动</p>

<p class="prose">活跃角色可以花费一个部分动作来移动等于他的敏捷加值的米数。如果花费一个完整动作，他可以移动两倍的距离。如果活跃角色在与对手相邻的位置结束移动，他可以与该对手接入近战。如果活跃角色远离与他接战的对手，则该对手可以对活跃角色进行一次自由的基础攻击。</p>
