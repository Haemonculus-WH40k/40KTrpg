<p class="prose">本冒险中穿插了众多主持人指导边栏，为主持人提供建议和进一步细节，说明如何进行一场遭遇或应对玩家角色的行动。这些边栏可能会给出遭遇结果的建议和解决方案，或揭示某个事件背后的设计思路，以帮助主持人更好地主持冒险。主持人指导边栏还提供了如何根据主持人所带的探险者团队来调整冒险强度等级的具体细节。鉴于本冒险的开放性以及大量可能的结果和对抗，本冒险没有设定或预设的等级或利润点要求。相反，主持人可以根据玩家角色的能力来调整遭遇的难度。</p>
