<p class="prose">尽管灵族可以使用为人类设计的武器与护甲，但大多数灵族并不愿如此——灵族科技更契合其审美与身体比例，且大多数灵族视人类制造的战争装备为粗陋笨拙之物。灵族使用人类制造的装备并无特定减值，但人类护甲无法舒适地贴合灵族身体，而人类制造的武器通常显得笨重不便。</p>
