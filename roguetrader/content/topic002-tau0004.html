<p class="prose">与人类角色一样，钛族探索者也具有玩家在创建角色时生成的属性点。但与人类探索者不同，钛族在属性点分配上具有不同的基础值（参见表1-1：钛族属性）。</p>

<p>起始承伤：钛族角色掷骰1d5+2并将其起始坚韧加值的两倍加到结果中以确定其起始承伤值。</p>

<p>起始命运点数：所有钛族角色都以1个命运点开始游戏。</p>
