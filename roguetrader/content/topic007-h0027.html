<p>前置：痛苦即力量</p>

<p class="prose">黑暗灵族因他人的痛苦而重获活力，在汲取痛苦时将致命创伤化为琐碎不便。在消耗一个命运点恢复已失承伤后，此角色在遭遇剩余时间内每获得一个痛苦点便恢复 1d5 点已失承伤。</p>
