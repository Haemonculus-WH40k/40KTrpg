<p>前置：黑暗灵族，怜悯弱者，武器技能 40</p>

<p class="prose">黑暗灵族在战斗中凶残暴虐，嗜好暴力带来的野蛮快感，以及屠戮弱者所带来的权力感。当对处于眩晕或倒地状态的敌人进行近战攻击或贴身远程攻击时，该攻击获得确凿(4)。</p>
