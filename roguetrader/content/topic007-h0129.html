<p class="prose">探险者遭遇3d10名逃脱的奴隶（使用受折磨人类的数据），他们一直躲藏求生。因为害怕被发现，他们愿意竭尽所能帮助玩家角色——前提是不被出卖——用自己知晓的关于阴影枢纽与黑暗灵族的零散信息换取自由。此外，探险者也可以选择利用这些奴隶博取黑暗灵族的好感，将他们送回原主人手中接受惩罚。但奴隶们几乎不可能自愿回到满是折磨的生活中去。</p>
