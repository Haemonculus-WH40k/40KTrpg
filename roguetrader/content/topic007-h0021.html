<p>前置：痛苦即力量，腐化10+</p>

<p class="prose">黑暗灵族对痛苦的渴求与日俱增，他向更远处攫取以满足那邪恶的饥渴。此角色将其腐化点的第一位数字（以米计）加入获得痛苦点的范围。</p>
