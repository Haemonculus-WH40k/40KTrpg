<p class="prose">与人类角色一样，黑暗灵族的属性也是逐一生成的。人类属性均以相同方式生成——掷2d10并将结果加上25，但黑暗灵族的每项属性均有不同的基础值。具体详见表4-1：黑暗灵族属性。</p>

<p><strong>初始承伤：</strong>黑暗灵族角色掷1d5+1，并将结果加上两倍的初始坚韧加值，以确定其初始承伤。</p>

<p><strong>初始命运点：</strong>所有黑暗灵族角色在游戏开始时拥有1点命运点。</p>
