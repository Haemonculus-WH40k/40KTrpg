<p>智力，技能组：黑暗灵族语</p>

<p>听说语言用于以相同语言与他人交流。以下新增技能组已加入可用技能之列。本技能运作方式不变。</p>

<p class="prose"><strong>-黑暗灵族语：</strong>灵族古老语言中一种粗粝而短促的方言，在科摩罗的街道与荒原以及阴影枢纽等前哨站中尤为常见，以其对疼痛与恐惧类型的大量词汇而著称。</p>
