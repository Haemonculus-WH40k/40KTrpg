<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=9"><title>高贵访客</title><link rel="stylesheet" href="style.css"></head><body class="semantic-topic"><h1>高贵访客</h1><div class="source-note">来源：RT灵魂掠夺者.docx</div><div class="semantic-path"><a href="topic007.html">RT灵魂掠夺者（黑暗灵族扩）</a></div><nav class="semantic-nav"><a class="prev" href="topic007-h0130.html#topic007-h0130">← 被遗忘的防御系统</a><a class="up" href="topic007-h0118.html#topic007-h0118">↑ 阴影枢纽遭遇表</a><a class="next" href="topic007-h0132.html#topic007-h0132">边地掠食者 →</a></nav><span id="topic007-h0131" class="anchor"></span>
<p class="prose">这是一队前来与黑暗灵族开展贸易的人类或异形使团。他们大概率不愿和被黑暗灵族追捕的探险者扯上关系，但玩家角色可以将他们用作掩护，或是劫持为人质。如果使团成员是人类，GM可借此将来自科洛努斯扩区或卡利西斯星区的NPC引入剧情，也可以将他们和队伍此前打过交道的帝国组织建立关联。另外，如果GM还没有为这种场合提前准备好NPC，也可以让西里萨或赫纳里斯参与这次会面。</p>
